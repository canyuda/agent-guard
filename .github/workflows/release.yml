# release.yml — tag 触发自动发布(流程见 docs/release.md §五)
# 前置:repo secret NPM_TOKEN(npmjs Automation token,见文档"一次性前置")
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # 手动触发:演练整条流水线,publish 按下方 if 跳过,不发包

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  publish:
    needs: test
    if: github.event_name == 'push'   # 仅 tag 推送真发布;手动触发只验证到 test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # tag 含 -(如 v0.2.0-beta.1)按预发布走 beta 通道,不污染 latest
      - name: npm publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
